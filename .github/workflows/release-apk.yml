name: Release Android TV APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags e.g. v1.0.0, v1.0.1

jobs:
  build-and-release:
    name: Build Signed Android TV APK & Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Patch minSdk via Gradle Init Script
        run: |
          # Flutter 3.x menjalankan "Upgrading build.gradle.kts" DUA KALI:
          # 1. Saat 'flutter pub get'
          # 2. Saat 'flutter build apk' (di awal, sebelum Gradle task)
          # Akibatnya, sed patch yang diterapkan di antara keduanya selalu dibalik.
          #
          # Solusi: Gradle Init Script di ~/.gradle/init.d/ yang:
          # - Tidak bisa disentuh oleh Flutter migration
          # - Dieksekusi oleh Gradle sendiri di tahap konfigurasi
          # - Override minSdk SETELAH semua migration Flutter selesai
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/override-minsdk.gradle << 'GRADLE_INIT_EOF'
          allprojects {
            afterEvaluate { project ->
              if (project.plugins.hasPlugin('com.android.application')) {
                // Hardcode minSdk=21 untuk kompatibilitas STB Android 6 (API 23)
                // seperti HG680P / Amlogic S905X.
                // Flutter 3.x migration selalu reset minSdk ke flutter.minSdkVersion (API 24),
                // sehingga override harus dilakukan di Gradle level bukan di build.gradle.kts.
                project.android.defaultConfig.minSdk = 21
                println(">>> [override-minsdk] minSdk dipaksa ke 21 untuk STB Android 6 compatibility")
              }
            }
          }
          GRADLE_INIT_EOF
          echo "=== Init script berhasil dibuat ==="
          cat ~/.gradle/init.d/override-minsdk.gradle

      - name: Build Android TV Release APK
        run: |
          cd tv
          flutter pub get
          # Build split-per-abi: lebih kecil ukurannya, pilih sesuai arsitektur STB
          flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=https://anivora.efzyn.my.id/api/v1
          # Build universal APK: satu file untuk semua arsitektur (arm32, arm64, x86_64)
          # Cocok untuk STB yang tidak diketahui arsitekturnya, ukuran lebih besar
          flutter build apk --release --dart-define=API_BASE_URL=https://anivora.efzyn.my.id/api/v1

      - name: Extract Version from Tag
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          VERSION_CODE=${{ github.run_number }}
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Collect and Rename APKs
        id: collect_apks
        run: |
          mkdir -p release_artifacts
          # Copy split APKs
          cp tv/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_artifacts/anivora-tv-${{ github.ref_name }}-arm64.apk
          cp tv/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_artifacts/anivora-tv-${{ github.ref_name }}-arm32.apk
          cp tv/build/app/outputs/flutter-apk/app-x86_64-release.apk release_artifacts/anivora-tv-${{ github.ref_name }}-x86_64.apk
          # Copy universal APK (untuk STB yang tidak diketahui arsitekturnya)
          cp tv/build/app/outputs/flutter-apk/app-release.apk release_artifacts/anivora-tv-${{ github.ref_name }}-universal.apk
          cd release_artifacts
          sha256sum *.apk > checksums.sha256

      - name: Create GitHub Release & Upload APK Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "ANIVORA TV ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release_artifacts/*.apk
            release_artifacts/checksums.sha256
          body: |
            ## 📺 ANIVORA Android TV ${{ github.ref_name }} (Build #${{ github.run_number }})

            ### ✨ Informasi Build
            - **Target Server:** `https://anivora.efzyn.my.id/api/v1`
            - **Minimum Android:** 5.0+ (API 21) — kompatibel dengan Android 6 (STB HG680P/Amlogic S905X)
            - **Target Android:** API 36
            - **Hardware Acceleration:** Native Media3 / ExoPlayer support
            - **Remote Focus Engine:** Full D-Pad Leanback UI

            ### 📦 Pilihan APK
            | File | Arsitektur | Keterangan |
            |------|-----------|------------|
            | `anivora-tv-*-arm64.apk` | ARM 64-bit | STB modern: HG680P, S905X, S912, dll |
            | `anivora-tv-*-arm32.apk` | ARM 32-bit | STB lama: S805, S905, dll |
            | `anivora-tv-*-x86_64.apk` | x86 64-bit | Emulator / Android TV Intel |
            | `anivora-tv-*-universal.apk` | Semua arsitektur | **Gunakan ini jika tidak tahu arsitektur STB** (ukuran lebih besar) |

            > ⚠️ **Jika muncul "Parse Error" saat install:** Gunakan file `universal.apk` atau pastikan memilih APK yang sesuai arsitektur STB Anda.

            ### 🔐 SHA-256 Checksums:
            Cek integritas file APK pada file lampiran `checksums.sha256`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

