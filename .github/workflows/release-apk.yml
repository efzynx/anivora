name: Release Android TV APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags e.g. v1.0.0, v1.0.1

jobs:
  build-and-release:
    name: Build Signed Android TV APK & Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Android TV Release APK
        run: |
          cd tv
          flutter pub get
          # Menggunakan domain Cloudflare Anda secara otomatis melalui --dart-define
          # Menggunakan --split-per-abi agar STB (Android 6) tidak error saat parsing APK besar
          flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=https://anivora.efzyn.my.id/api/v1

      - name: Extract Version from Tag
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          VERSION_CODE=${{ github.run_number }}
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Collect and Rename APKs
        id: collect_apks
        run: |
          mkdir -p release_artifacts
          cp tv/build/app/outputs/flutter-apk/app-*-release.apk release_artifacts/
          cd release_artifacts
          for f in *.apk; do mv "$f" "anivora-tv-${{ steps.get_version.outputs.VERSION }}-$f"; done
          sha256sum *.apk > checksums.sha256

      - name: Create GitHub Release & Upload APK Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "ANIVORA TV v${{ steps.get_version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release_artifacts/*.apk
            release_artifacts/checksums.sha256
          body: |
            ## 📺 ANIVORA Android TV v${{ steps.get_version.outputs.VERSION }} (Build #${{ steps.get_version.outputs.VERSION_CODE }})

            ### ✨ Informasi Build
            - **Target Server:** `https://anivora.efzyn.my.id/api/v1`
            - **Kompabilitas:** Android 6.0+ (API 23), Amlogic S905/S912 baseline
            - **Hardware Acceleration:** Native Media3 / ExoPlayer support
            - **Remote Focus Engine:** Full D-Pad Leanback UI

            ### 📦 SHA-256 Checksums:
            Cek integritas file APK pada file lampiran `checksums.sha256`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
