name: Release Android TV APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags e.g. v1.0.0, v1.0.1

jobs:
  build-and-release:
    name: Build Signed Android TV APK & Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Patch Android via Gradle Init Script
        run: |
          # Flutter 3.x menjalankan "Upgrading build.gradle.kts" DUA KALI
          # (saat pub get & saat flutter build apk), sehingga sed patch selalu dibalik.
          # Solusi: Gradle Init Script di ~/.gradle/init.d/ yang tidak bisa disentuh
          # Flutter migration dan dieksekusi Gradle SETELAH semua migration selesai.
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/override-android.gradle << 'GRADLE_INIT_EOF'
          allprojects {
            afterEvaluate { project ->
              def isAndroidApp = project.plugins.hasPlugin('com.android.application')
              def isAndroidLib = project.plugins.hasPlugin('com.android.library')
              if (isAndroidApp || isAndroidLib) {
                // Override minSdk=23 untuk semua project (app + semua plugin/library).
                // Diperlukan agar manifest merger tidak conflict ketika plugin
                // (wakelock_plus, dll) menggunakan flutter.minSdkVersion=24.
                project.android.defaultConfig.minSdk = 23
                println(">>> [android-patch] ${project.name}: minSdk=23")
              }
              if (isAndroidApp) {
                // Gunakan legacy packaging agar native libs diekstrak ke disk saat install.
                // Diperlukan untuk firmware Android 6 pada STB (HG680P/Amlogic S905X).
                // JANGAN set extractNativeLibs="true" di AndroidManifest karena
                // AGP (Android Gradle Plugin) baru melarang cara tersebut.
                project.android.packagingOptions.jniLibs.useLegacyPackaging = true
                println(">>> [android-patch] ${project.name}: useLegacyPackaging=true")
              }
            }
          }
          GRADLE_INIT_EOF
          echo "=== Gradle Init Script berhasil dibuat ==="
          cat ~/.gradle/init.d/override-android.gradle

      - name: Build Android TV Release APK
        run: |
          cd tv
          flutter pub get
          # Build split-per-abi: lebih kecil ukurannya, pilih sesuai arsitektur STB
          # --android-skip-build-dependency-validation: bypass DependencyValidationException
          # dari Flutter Gradle plugin saat minSdk lebih rendah dari flutter.minSdkVersion
          flutter build apk --release --split-per-abi \
            --android-skip-build-dependency-validation \
            --dart-define=API_BASE_URL=https://anivora.efzyn.my.id/api/v1
          # Build universal APK: satu file untuk semua arsitektur (arm32, arm64, x86_64)
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --dart-define=API_BASE_URL=https://anivora.efzyn.my.id/api/v1

      - name: Extract Version from Tag
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          VERSION_CODE=${{ github.run_number }}
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Collect and Rename APKs
        id: collect_apks
        run: |
          mkdir -p release_artifacts
          # Copy split APKs
          cp tv/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_artifacts/anivora-tv-${{ github.ref_name }}-arm64.apk
          cp tv/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_artifacts/anivora-tv-${{ github.ref_name }}-arm32.apk
          cp tv/build/app/outputs/flutter-apk/app-x86_64-release.apk release_artifacts/anivora-tv-${{ github.ref_name }}-x86_64.apk
          # Copy universal APK (untuk STB yang tidak diketahui arsitekturnya)
          cp tv/build/app/outputs/flutter-apk/app-release.apk release_artifacts/anivora-tv-${{ github.ref_name }}-universal.apk
          cd release_artifacts
          sha256sum *.apk > checksums.sha256

      - name: Create GitHub Release & Upload APK Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "ANIVORA TV ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release_artifacts/*.apk
            release_artifacts/checksums.sha256
          body: |
            ## 📺 ANIVORA Android TV ${{ github.ref_name }} (Build #${{ github.run_number }})

            ### ✨ Informasi Build
            - **Target Server:** `https://anivora.efzyn.my.id/api/v1`
            - **Minimum Android:** 6.0 (API 23) — kompatibel dengan STB HG680P/Amlogic S905X
            - **Target Android:** API 36
            - **Hardware Acceleration:** Native Media3 / ExoPlayer support
            - **Remote Focus Engine:** Full D-Pad Leanback UI

            ### 📦 Pilihan APK
            | File | Arsitektur | Keterangan |
            |------|-----------|------------|
            | `anivora-tv-*-arm64.apk` | ARM 64-bit | STB modern: HG680P (64-bit firmware) |
            | `anivora-tv-*-arm32.apk` | ARM 32-bit | **STB HG680P (32-bit firmware) ← coba ini dulu** |
            | `anivora-tv-*-x86_64.apk` | x86 64-bit | Emulator / Android TV Intel |
            | `anivora-tv-*-universal.apk` | Semua arsitektur | **Gunakan ini jika tidak tahu arsitektur STB** |

            > ⚠️ **HG680P/Amlogic S905X:** Meskipun chip 64-bit, banyak firmware menggunakan Android 32-bit. Coba `arm32.apk` terlebih dahulu.

            ### 🔐 SHA-256 Checksums:
            Cek integritas file APK pada file lampiran `checksums.sha256`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
