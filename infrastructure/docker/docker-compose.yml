services:
  postgres:
    image: postgres:15-alpine
    container_name: anivora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anivora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anivora_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-anivora_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - anivora_postgres_data:/var/lib/postgresql/data
      - ./postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anivora_user} -d ${POSTGRES_DB:-anivora_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anivora-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-anivora_redis_secret} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - anivora_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-anivora_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  anivora_postgres_data:
    name: anivora_postgres_data
  anivora_redis_data:
    name: anivora_redis_data
